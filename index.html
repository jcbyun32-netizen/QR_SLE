<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR & 시리얼 자동 비교</title>
  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.19.1/umd/index.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      max-width: 520px; margin: 0 auto; padding: 12px; text-align: center;
    }
    .logo { max-width: 160px; width: 50%; height: auto; margin: 2px auto 6px; display: block; }
    h2 { margin: 4px 0 10px; font-size: 20px; }

    #video-container {
      position: relative; width: 100%; aspect-ratio: 4 / 3;
      border-radius: 12px; overflow: hidden; background: #000; touch-action: manipulation;
    }
    video { width: 100%; height: 100%; object-fit: cover; display: block; }
    canvas { display: none; }

    .focus-ring {
      position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px;
      border: 2px solid #ffd54a; border-radius: 50%; pointer-events: none;
      opacity: 0; transform: scale(1.5); transition: opacity .15s, transform .25s;
    }
    .focus-ring.on { opacity: 1; transform: scale(1); }
    .scan-guide {
      position: absolute; inset: 10%; border: 2px dashed rgba(255,255,255,.55);
      border-radius: 10px; pointer-events: none;
    }
    .busy-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,.6); color: #fff;
      display: none; align-items: center; justify-content: center; flex-direction: column;
      font-weight: bold; font-size: 16px; gap: 10px;
    }
    .busy-overlay.show { display: flex; }
    .spinner {
      width: 34px; height: 34px; border: 4px solid rgba(255,255,255,.3);
      border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .cam-tools { display: none; align-items: center; gap: 10px; margin-top: 8px; }
    .cam-tools.show { display: flex; }
    .cam-tools label { font-size: 13px; color: #555; white-space: nowrap; }
    .cam-tools input[type=range] { flex: 1; }
    .tool-btn {
      width: auto; margin: 0; padding: 8px 12px; font-size: 14px; background: #6c757d;
    }
    .tool-btn.active { background: #f0ad00; }
    .hint { font-size: 12px; color: #888; margin-top: 6px; }

    .status-badge {
      margin: 10px 0; padding: 10px; border-radius: 8px; background: #f0f0f0;
      font-weight: bold; font-size: 14px; word-break: keep-all;
    }
    .stats { font-size: 13px; color: #555; margin-top: 8px; }

    button {
      width: 100%; padding: 14px; font-size: 16px; font-weight: bold; color: #fff;
      background: #007bff; border: none; border-radius: 8px; margin-top: 10px;
    }
    button:disabled { background: #ccc; }

    .export-box { margin-top: 12px; padding: 10px; border: 1px solid #ddd; border-radius: 10px; text-align: left; }
    .export-box .row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #555; }
    .export-box select { flex: 1; padding: 8px; font-size: 14px; border-radius: 6px; border: 1px solid #ccc; }
    #exportBtn { background: #1d7a46; }
    #clearBtn { background: #6c757d; font-size: 14px; padding: 10px; }
    .history { max-height: 240px; overflow-y: auto; }
    .history { margin-top: 12px; text-align: left; font-size: 13px; }
    .history div { padding: 6px 8px; border-bottom: 1px solid #eee; word-break: break-all; }
    .history .ok { color: #155724; }
    .history .ng { color: #721c24; }

    /* 결과 팝업 */
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 100;
      display: none; align-items: center; justify-content: center; padding: 18px;
    }
    .modal.show { display: flex; }
    .modal-card {
      background: #fff; width: 100%; max-width: 420px; border-radius: 16px;
      padding: 22px 18px 18px; text-align: center; border-top: 10px solid #999;
      max-height: 92vh; overflow-y: auto;
    }
    .modal-card.match { border-top-color: #28a745; }
    .modal-card.mismatch { border-top-color: #dc3545; }
    .modal-card.error { border-top-color: #f0ad00; }
    .m-icon { font-size: 54px; line-height: 1; }
    .m-title { font-size: 21px; font-weight: bold; margin: 10px 0 4px; word-break: keep-all; }
    .match .m-title { color: #155724; }
    .mismatch .m-title { color: #721c24; }
    .error .m-title { color: #856404; }
    .m-note { font-size: 13px; color: #856404; margin-bottom: 6px; }
    .m-detail {
      text-align: left; font-size: 14px; line-height: 1.6; background: #f6f6f6;
      border-radius: 8px; padding: 10px 12px; margin-top: 10px; word-break: break-all;
    }
    .m-thumb { max-width: 100%; margin-top: 10px; border-radius: 8px; border: 1px solid #ddd; }
    .match #mBtn { background: #28a745; }
    .mismatch #mBtn, .error #mBtn { background: #dc3545; }
  </style>
</head>

  <h2>QR & 시리얼 자동 검증</h2>

  <div id="video-container">
    <video id="video" playsinline muted></video>
    <div class="scan-guide"></div>
    <div id="focusRing" class="focus-ring"></div>
    <div id="busyOverlay" class="busy-overlay"><div class="spinner"></div><div id="busyText">검증 중...</div></div>
  </div>
  <canvas id="canvas"></canvas>

  <div id="camTools" class="cam-tools">
    <label for="zoomRange" id="zoomLabel">확대</label>
    <input type="range" id="zoomRange" min="1" max="1" step="0.1" value="1">
    <button id="torchBtn" class="tool-btn" type="button" style="display:none;">💡 조명</button>
  </div>
  <div class="hint">화면을 탭하면 그 위치로 초점을 다시 맞춥니다. 점선 안에 라벨을 맞춰주세요.</div>

  <div id="status" class="status-badge">준비 중...</div>

  <button id="scanBtn" onclick="togglePause()" disabled>일시정지</button>
  <div class="stats" id="stats">일치 0 · 불일치 0</div>

  <div class="export-box">
    <div class="row"><label for="dateSel">저장할 날짜</label><select id="dateSel"></select></div>
    <button id="exportBtn" type="button">📥 엑셀로 저장</button>
    <button id="clearBtn" type="button">오늘 기록 지우기</button>
  </div>

  <div class="history" id="history"></div>

  <!-- 검증 완료 후 표시되는 결과 팝업 (확인 버튼을 눌러야 다음 스캔 시작) -->
  <div id="modal" class="modal">
    <div id="modalCard" class="modal-card">
      <div id="mIcon" class="m-icon"></div>
      <div id="mTitle" class="m-title"></div>
      <div id="mNote" class="m-note"></div>
      <div id="mDetail" class="m-detail"></div>
      <img id="mThumb" class="m-thumb" alt="" style="display:none;">
      <button id="mBtn" type="button">확인</button>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const video = $('video');
    const canvas = $('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = $('status');
    const scanBtn = $('scanBtn');
    const box = $('video-container');

    let worker = null;
    let ocrInit = null;      // OCR 엔진 로딩 Promise
    let codeReader = null;
    let track = null;        // 카메라 비디오 트랙 (초점/줌/조명 제어용)
    let caps = {};
    let paused = false;
    let busy = false;        // 검증 중이거나 팝업이 떠 있는 동안 true → 새 스캔 무시
    let torchOn = false;
    let focusTimer = null;
    // ---- 하루 검증 기록 (브라우저에 날짜별로 자동 저장됨) ----
    const STORE_PREFIX = 'qrHistory:';
    let records = [];
    let recordsKey = '';

    function todayKey() {
      const d = new Date(), p = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
    }
    function readDay(key) {
      try { return JSON.parse(localStorage.getItem(STORE_PREFIX + key) || '[]').filter(r => r.status === 'match'); } catch (e) { return []; }
    }
    function loadRecords() {
      recordsKey = todayKey();
      records = readDay(recordsKey);
      // 60일이 지난 기록은 정리
      try {
        const limit = Date.now() - 60 * 86400000;
        Object.keys(localStorage).filter(k => k.startsWith(STORE_PREFIX)).forEach(k => {
          if (new Date(k.slice(STORE_PREFIX.length)).getTime() < limit) localStorage.removeItem(k);
        });
      } catch (e) {}
    }
    function saveRecords() {
      try { localStorage.setItem(STORE_PREFIX + recordsKey, JSON.stringify(records)); }
      catch (e) { console.warn('기록 저장 실패', e); }
    }
    function addRecord(r) {
      if (recordsKey !== todayKey()) loadRecords();   // 자정이 지났으면 새 날짜로
      records.push(r);
      saveRecords();
      renderHistory();
    }
    function statusLabel(r) {
      if (r.status === 'match') return r.fuzzy ? '일치(유사문자 보정)' : '일치';
      return r.status === 'mismatch' ? '불일치' : '미인식';
    }
    function refreshDateSelect() {
      const sel = $('dateSel');
      const prev = sel.value;
      let keys = [];
      try { keys = Object.keys(localStorage).filter(k => k.startsWith(STORE_PREFIX)).map(k => k.slice(STORE_PREFIX.length)); } catch (e) {}
      if (!keys.includes(recordsKey)) keys.push(recordsKey);
      keys.sort().reverse();
      sel.innerHTML = keys.map(k => {
        const n = k === recordsKey ? records.length : readDay(k).length;
        return `<option value="${k}">${k}${k === recordsKey ? ' (오늘)' : ''} · ${n}건</option>`;
      }).join('');
      sel.value = keys.includes(prev) ? prev : recordsKey;
    }

    function exportExcel() {
      const key = $('dateSel').value || recordsKey;
      const rows = key === recordsKey ? records : readDay(key);
      if (!rows.length) { alert('저장할 기록이 없습니다.'); return; }
      if (typeof XLSX === 'undefined') { alert('엑셀 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.'); return; }

      const head = ['번호', '날짜', '시간', 'QR 값', '인식된 글자', '결과'];
      const body = rows.map((r, i) => [i + 1, key, r.time, r.qr, (r.ocr || '').replace(/\s*\n+\s*/g, ' '), statusLabel(r)]);
      const ws = XLSX.utils.aoa_to_sheet([head, ...body]);
      ws['!cols'] = [{ wch: 6 }, { wch: 12 }, { wch: 10 }, { wch: 34 }, { wch: 40 }, { wch: 18 }];

      const ws2 = XLSX.utils.aoa_to_sheet([['날짜', key], ['일치 확인 건수', rows.length]]);
      ws2['!cols'] = [{ wch: 14 }, { wch: 14 }];

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'QR검증');
      XLSX.utils.book_append_sheet(wb, ws2, '요약');
      XLSX.writeFile(wb, `QR검증_${key}.xlsx`);
    }

    const READY_TEXT = "QR코드를 찾는 중... 점선 안에 라벨을 맞춰주세요.";

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // ---------- 1. OCR 엔진 ----------
    function initOCR() {
      ocrInit = (async () => {
        try {
          worker = await Tesseract.createWorker('eng', 1, { logger: () => {} });
          await worker.setParameters({
            tessedit_pageseg_mode: Tesseract.PSM.SINGLE_BLOCK,
            tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ -_'
          });
          return true;
        } catch (err) {
          console.error('[Tesseract 로딩 실패]', err);
          statusEl.innerText = "문자 인식 엔진 로딩 실패: 인터넷 연결을 확인해 주세요.";
          return false;
        }
      })();
    }

    // ---------- 2. 카메라 + QR 스캔 (고해상도 + 연속 초점) ----------
    async function startQrScanning() {
      try {
        codeReader = new ZXing.BrowserQRCodeReader(150);   // 150ms 간격으로 빠르게 시도
        try { codeReader.hints = new Map([[ZXing.DecodeHintType.TRY_HARDER, true]]); } catch (e) {}

        const constraints = {
          audio: false,
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }
        };
        if (typeof codeReader.decodeFromConstraints === 'function') {
          await codeReader.decodeFromConstraints(constraints, video, onScan);
        } else {
          await codeReader.decodeFromVideoDevice(null, video, onScan);
        }

        await setupTrack();
        statusEl.innerText = READY_TEXT;
        scanBtn.disabled = false;
      } catch (err) {
        console.error('[카메라/ZXing 오류]', err);
        statusEl.innerText = "카메라를 켤 수 없습니다. 브라우저 카메라 권한을 확인해 주세요.";
        alert("카메라 접근 권한이 필요합니다. 브라우저 설정에서 권한을 허용해 주세요.");
      }
    }

    async function setupTrack() {
      for (let i = 0; i < 30 && !(video.srcObject && video.videoWidth); i++) {
        await new Promise(r => setTimeout(r, 100));
      }
      track = video.srcObject && video.srcObject.getVideoTracks()[0];
      if (!track) return;
      caps = track.getCapabilities ? track.getCapabilities() : {};
      await applyContinuousFocus();

      // 확대(줌) 슬라이더
      if (caps.zoom) {
        const z = $('zoomRange');
        z.min = caps.zoom.min; z.max = caps.zoom.max; z.step = caps.zoom.step || 0.1;
        let saved = 1;
        try { saved = parseFloat(localStorage.getItem('qrZoom')) || 1; } catch (e) {}
        z.value = Math.min(Math.max(saved, caps.zoom.min), caps.zoom.max);
        z.oninput = async () => {
          try { await track.applyConstraints({ advanced: [{ zoom: parseFloat(z.value) }] }); } catch (e) {}
          try { localStorage.setItem('qrZoom', z.value); } catch (e) {}
          $('zoomLabel').innerText = '확대 ' + parseFloat(z.value).toFixed(1) + '×';
        };
        z.oninput();
      } else {
        $('zoomRange').style.display = 'none';
        $('zoomLabel').style.display = 'none';
      }
      // 조명(토치)
      if (caps.torch) {
        const tb = $('torchBtn');
        tb.style.display = '';
        tb.onclick = async () => {
          torchOn = !torchOn;
          try { await track.applyConstraints({ advanced: [{ torch: torchOn }] }); } catch (e) { torchOn = false; }
          tb.classList.toggle('active', torchOn);
        };
      }
      $('camTools').classList.add('show');
    }

    async function applyContinuousFocus() {
      if (!track) return;
      try {
        if (caps.focusMode && caps.focusMode.includes('continuous')) {
          await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
        }
      } catch (e) { console.warn('연속 초점 설정 실패', e); }
    }

    // 화면에 실제로 보이는 영역(object-fit: cover로 잘린 부분을 제외한 영역)을 영상 좌표로 계산
    function visibleRect() {
      const vw = video.videoWidth, vh = video.videoHeight;
      const cw = box.clientWidth, ch = box.clientHeight;
      const s = Math.max(cw / vw, ch / vh);
      const w = cw / s, h = ch / s;
      return { x: (vw - w) / 2, y: (vh - h) / 2, w, h, scale: s };
    }

    // 탭하여 초점 맞추기
    box.addEventListener('click', async e => {
      if (busy) return;
      const r = box.getBoundingClientRect();
      const px = e.clientX - r.left, py = e.clientY - r.top;
      const ring = $('focusRing');
      ring.style.left = px + 'px'; ring.style.top = py + 'px';
      ring.classList.add('on');
      setTimeout(() => ring.classList.remove('on'), 900);
      if (!track || !video.videoWidth) return;

      const v = visibleRect();
      const nx = (v.x + px / v.scale) / video.videoWidth;
      const ny = (v.y + py / v.scale) / video.videoHeight;
      try {
        const adv = { focusMode: 'single-shot' };
        adv.pointsOfInterest = [{ x: nx, y: ny }];
        await track.applyConstraints({ advanced: [adv] });
      } catch (err) {
        try { await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e2) {}
      }
      clearTimeout(focusTimer);
      focusTimer = setTimeout(applyContinuousFocus, 1500);
    });

    // ---------- 3. 일시정지 ----------
    function togglePause() {
      paused = !paused;
      scanBtn.innerText = paused ? "다시 시작" : "일시정지";
      statusEl.innerText = paused ? "일시정지됨. 버튼을 누르면 다시 스캔합니다." : READY_TEXT;
    }

    // ---------- 4. QR 인식 콜백 ----------
    function onScan(result, err) {
      if (busy || paused || !result) return;
      const pts = result.getResultPoints() || [];
      if (!pts.length) return;
      const xs = pts.map(p => p.getX()), ys = pts.map(p => p.getY());
      const qr = { minX: Math.min(...xs), maxX: Math.max(...xs), minY: Math.min(...ys), maxY: Math.max(...ys) };
      // 화면에 보이지 않는 영역의 QR은 무시 (보이는 것만 검증)
      const v = visibleRect();
      const cx = (qr.minX + qr.maxX) / 2, cy = (qr.minY + qr.maxY) / 2;
      if (cx < v.x || cx > v.x + v.w || cy < v.y || cy > v.y + v.h) return;
      busy = true;
      verifyLabel(result.getText().trim(), qr);
    }

    // ---------- 5. OCR 전처리 (확대 + 흑백 + 대비 보정) ----------
    function preprocess(src) {
      const target = Math.max(0.5, Math.min(2, 1600 / src.width));
      const c = document.createElement('canvas');
      c.width = Math.round(src.width * target);
      c.height = Math.round(src.height * target);
      const g = c.getContext('2d');
      g.drawImage(src, 0, 0, c.width, c.height);
      const img = g.getImageData(0, 0, c.width, c.height);
      const d = img.data;
      const hist = new Array(256).fill(0);
      for (let i = 0; i < d.length; i += 4) {
        const y = Math.round(0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]);
        d[i] = y; hist[y]++;
      }
      const total = c.width * c.height;
      let lo = 0, hi = 255, acc = 0;
      for (let i = 0; i < 256; i++) { acc += hist[i]; if (acc > total * 0.02) { lo = i; break; } }
      acc = 0;
      for (let i = 255; i >= 0; i--) { acc += hist[i]; if (acc > total * 0.02) { hi = i; break; } }
      const range = Math.max(1, hi - lo);
      for (let i = 0; i < d.length; i += 4) {
        const v = Math.max(0, Math.min(255, (d[i] - lo) * 255 / range));
        d[i] = d[i + 1] = d[i + 2] = v;
      }
      g.putImageData(img, 0, 0);
      return c;
    }

    function cropCanvas(src, x, y, w, h) {
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h));
      c.getContext('2d').drawImage(src, x, y, w, h, 0, 0, c.width, c.height);
      return c;
    }

    // ---------- 6. 비교 ----------
    const norm = s => s.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
    // OCR이 자주 혼동하는 글자(O/0, I·L/1, S/5, B/8, Z/2)를 같은 글자로 취급
    const fold = s => norm(s).replace(/O/g, '0').replace(/[IL]/g, '1').replace(/S/g, '5').replace(/B/g, '8').replace(/Z/g, '2');

    function compare(qrText, ocrText) {
      const q = norm(qrText);
      if (!q) return null;
      if (norm(ocrText).includes(q)) return 'exact';
      if (fold(ocrText).includes(fold(qrText))) return 'fuzzy';
      return null;
    }

    // ---------- 7. 검증 (QR 인식 → OCR → 비교 → 팝업) ----------
    async function verifyLabel(qrText, qr) {
      showBusy(true, "QR 인식됨! 시리얼 글자 확인 중...");
      statusEl.innerText = "QR 인식됨! 글자 대조 중...";

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const v = visibleRect();
      // 후보 영역: ① QR 오른쪽 글자 영역 ② 화면 전체(보이는 영역)
      const crops = [];
      const margin = (qr.maxX - qr.minX) * 0.15;
      const cropX = Math.max(v.x, qr.maxX + margin);
      const rightW = v.x + v.w - cropX;
      if (rightW > 40) crops.push(cropCanvas(canvas, cropX, v.y, rightW, v.h));
      crops.push(cropCanvas(canvas, v.x, v.y, v.w, v.h));

      let outcome = { status: 'mismatch', text: '', note: '', thumb: null };
      try {
        const ready = await ocrInit;
        if (!ready || !worker) {
          outcome = { status: 'error', text: '', note: '문자 인식 엔진이 준비되지 않았습니다. 인터넷 연결을 확인 후 새로고침해 주세요.', thumb: null };
        } else {
          const texts = [];
          for (let i = 0; i < crops.length; i++) {
            const prep = preprocess(crops[i]);
            const res = await worker.recognize(prep);
            const text = (res.data.text || '').trim();
            texts.push(text);
            const m = compare(qrText, text);
            if (m) {
              outcome = { status: 'match', text, note: m === 'fuzzy' ? 'O/0, I/1 등 비슷한 글자를 보정해서 일치로 판정했습니다. 라벨을 한 번 더 눈으로 확인해 주세요.' : '', thumb: null };
              break;
            }
            if (i === crops.length - 1) {
              const joined = texts.filter(Boolean).join(' / ');
              outcome = {
                status: joined ? 'mismatch' : 'error',
                text: joined,
                note: joined ? '' : '라벨의 글자를 읽지 못했습니다. 초점/조명을 확인하고 다시 스캔해 주세요.',
                thumb: prep.toDataURL('image/jpeg', 0.6)
              };
            }
          }
        }
      } catch (e) {
        console.error('[검증 오류]', e);
        outcome = { status: 'error', text: '', note: '검증 중 오류가 발생했습니다. 다시 스캔해 주세요.', thumb: null };
      }

      showBusy(false);
      showResult(qrText, outcome);
    }

    function showBusy(on, text) {
      $('busyOverlay').classList.toggle('show', on);
      if (text) $('busyText').innerText = text;
    }

    // ---------- 8. 결과 팝업 (확인을 눌러야 다음 스캔) ----------
    function showResult(qrText, o) {
      const card = $('modalCard');
      card.className = 'modal-card ' + o.status;
      let icon, title, btn;
      if (o.status === 'match') {
        icon = '✅'; title = 'QR과 시리얼이 일치합니다'; btn = '확인 (다음 라벨 스캔)';
      } else if (o.status === 'mismatch') {
        icon = '❌'; title = 'QR과 시리얼이 일치하지 않습니다'; btn = '다시 스캔';
      } else {
        icon = '⚠️'; title = '시리얼을 확인하지 못했습니다'; btn = '다시 스캔';
      }
      $('mIcon').innerText = icon;
      $('mTitle').innerText = title;
      $('mNote').innerText = o.note || '';
      let html = `<b>QR 값:</b> ${esc(qrText)}`;
      if (o.text) html += `<br><b>인식된 글자:</b> ${esc(o.text.replace(/\s*\n+\s*/g, ' '))}`;
      $('mDetail').innerHTML = html;
      const thumb = $('mThumb');
      if (o.thumb) { thumb.src = o.thumb; thumb.style.display = 'block'; } else { thumb.style.display = 'none'; }
      $('mBtn').innerText = btn;
      $('modal').classList.add('show');

      if (navigator.vibrate) navigator.vibrate(o.status === 'match' ? 120 : [200, 100, 200]);

      if (o.status === 'match') {   // 불일치/미인식은 저장하지 않음
        addRecord({
          status: 'match', fuzzy: !!o.note, qr: qrText, ocr: o.text || '',
          time: new Date().toLocaleTimeString('ko-KR', { hour12: false })
        });
      }
      statusEl.innerText = "검증 완료! 결과를 확인하고 버튼을 눌러주세요.";
    }

    $('mBtn').addEventListener('click', () => {
      $('modal').classList.remove('show');
      statusEl.innerText = paused ? "일시정지됨. 버튼을 누르면 다시 스캔합니다." : READY_TEXT;
      setTimeout(() => { busy = false; }, 400);   // 팝업 닫는 순간 같은 라벨이 바로 재인식되는 것을 방지
    });

    function renderHistory() {
      $('stats').innerText = `오늘 일치 확인 ${records.length}건 (일치한 건만 저장됩니다)`;
      $('history').innerHTML = records.slice().reverse().map(r =>
        `<div class="ok">${esc(r.time)} · ✅ ${statusLabel(r)} · ${esc(r.qr)}</div>`
      ).join('');
      refreshDateSelect();
    }

    $('exportBtn').addEventListener('click', exportExcel);
    $('clearBtn').addEventListener('click', () => {
      if (!records.length) return;
      if (confirm(`오늘 기록 ${records.length}건을 모두 지울까요?\n(엑셀로 저장하지 않았다면 복구할 수 없습니다)`)) {
        records = [];
        saveRecords();
        renderHistory();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      loadRecords();
      renderHistory();
      initOCR();
      startQrScanning();
    });
  </script>
</body>
</html>
