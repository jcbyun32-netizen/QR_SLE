<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR & 시리얼 자동 비교</title>
  <!-- 안정적인 CDN으로 변경 -->
  <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.19.1/umd/index.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 500px;
      margin: 0 auto;
      padding: 15px;
      text-align: center;
    }
    .logo {
      max-width: 180px;
      width: 60%;
      height: auto;
      margin: 5px auto 10px;
      display: block;
    }
    #video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9; /* 폰은 세로로 들고 있어도, 미리보기 박스는 가로로 넓게 표시 */
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover; /* 세로로 찍히는 영상을 가로 박스에 맞게 중앙 크롭 */
      display: block;
    }
    canvas {
      display: none;
    }
    .status-badge {
      margin: 15px 0;
      padding: 10px;
      border-radius: 8px;
      background: #f0f0f0;
      font-weight: bold;
      font-size: 14px;
      word-break: keep-all;
    }
    .result-box {
      padding: 15px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      margin-top: 10px;
    }
    .match { background-color: #d4edda; color: #155724; }
    .mismatch { background-color: #f8d7da; color: #721c24; }
    .details {
      font-size: 13px;
      color: #555;
      margin-top: 8px;
      text-align: left;
      line-height: 1.5;
      word-break: break-all;
    }
    button {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background: #007bff;
      border: none;
      border-radius: 8px;
      margin-top: 10px;
    }
    button:disabled {
      background: #ccc;
    }
  </style>
</head>

  <h2>QR & 시리얼 자동 검증</h2>
  
  <div id="video-container">
    <video id="video" playsinline muted></video>
  </div>
  <canvas id="canvas"></canvas>

  <div id="status" class="status-badge">준비 중...</div>

  <button id="scanBtn" onclick="togglePause()" disabled>일시정지</button>

  <div id="resultBox" class="result-box" style="display:none;"></div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');
    const scanBtn = document.getElementById('scanBtn');

    let worker = null;       // Tesseract OCR 워커
    let codeReader = null;   // ZXing 실시간 QR 리더
    let paused = false;      // 사용자가 "일시정지"를 눌렀는지
    let busy = false;        // 지금 QR 인식 후 OCR/대조 처리 중인지 (중복 트리거 방지)
    const RESCAN_DELAY_MS = 2000; // 결과를 보여준 뒤 자동으로 다음 스캔을 재개하기까지 대기 시간

    // 1. Tesseract OCR 엔진 준비 (QR 스캔과 별개로 백그라운드에서 로딩)
    async function initOCR() {
      try {
        worker = await Tesseract.createWorker('eng', 1, {
          logger: m => console.log('[Tesseract]', m)
        });
        await worker.setParameters({
          tessedit_pageseg_mode: Tesseract.PSM.SINGLE_BLOCK,
          tessedit_char_whitelist: '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ -_'
        });
        console.log('[Tesseract] 준비 완료');
      } catch (err) {
        console.error('[Tesseract 로딩 실패]', err);
        statusEl.innerText = "문자 인식 엔진 로딩 실패: 인터넷 연결을 확인해 주세요.";
      }
    }

    // 2. ZXing의 공식 실시간 카메라 스캔 API로 후면 카메라를 찾아 QR 인식 시작
    //    (카메라 연결, 프레임 캡처, 반복 디코딩을 ZXing이 전부 알아서 처리함 - 직접 구현한 루프보다 훨씬 안정적)
    async function startQrScanning() {
      try {
        codeReader = new ZXing.BrowserQRCodeReader();

        const devices = await codeReader.listVideoInputDevices();
        if (!devices || devices.length === 0) {
          statusEl.innerText = "사용 가능한 카메라를 찾을 수 없습니다.";
          return;
        }
        // 후면 카메라로 추정되는 장치를 찾음 (label에 back/rear/environment가 포함된 것 우선)
        const rearCamera = devices.find(d => /back|rear|environment/i.test(d.label)) || devices[devices.length - 1];

        statusEl.innerText = "실시간으로 QR코드를 찾는 중... 라벨을 카메라에 비춰주세요.";
        scanBtn.disabled = false;

        codeReader.decodeFromVideoDevice(rearCamera.deviceId, video, (result, err) => {
          if (busy || paused) return;
          if (result) {
            busy = true;
            const points = result.getResultPoints();
            const xs = points.map(p => p.getX());
            verifyLabel(result.getText().trim(), Math.min(...xs), Math.max(...xs));
          }
          // err는 QR을 못 찾은 프레임마다 정상적으로 계속 발생함 (NotFoundException) - 무시
        });
      } catch (err) {
        console.error('[카메라/ZXing 오류]', err);
        statusEl.innerText = "카메라를 켤 수 없습니다. 브라우저 카메라 권한을 확인해 주세요.";
        alert("카메라 접근 권한이 필요합니다. 브라우저 설정에서 권한을 허용해 주세요.");
      }
    }

    // 3. 일시정지 / 재개 토글
    function togglePause() {
      paused = !paused;
      scanBtn.innerText = paused ? "다시 시작" : "일시정지";
      statusEl.innerText = paused
        ? "일시정지됨. 버튼을 누르면 다시 스캔합니다."
        : "실시간으로 QR코드를 찾는 중... 라벨을 카메라에 비춰주세요.";
    }

    // 4. QR이 인식된 시점의 화면을 캡처해서 OCR 및 시리얼 비교를 자동으로 수행
    async function verifyLabel(qrText, qrMinX, qrMaxX) {
      statusEl.innerText = "QR 인식됨! 글자 대조 중...";

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // QR 오른쪽의 "텍스트 영역"만 잘라내서 OCR 정확도를 높임
      let ocrSource = canvas;
      const qrWidth = qrMaxX - qrMinX;
      const margin = qrWidth * 0.15;
      const cropX = Math.min(canvas.width - 20, qrMaxX + margin);
      const cropWidth = canvas.width - cropX;
      if (cropWidth > 20) {
        const ocrCanvas = document.createElement('canvas');
        ocrCanvas.width = cropWidth;
        ocrCanvas.height = canvas.height;
        ocrCanvas.getContext('2d').drawImage(
          canvas, cropX, 0, cropWidth, canvas.height, 0, 0, cropWidth, canvas.height
        );
        ocrSource = ocrCanvas;
      }

      let detectedText = "";
      if (!worker) {
        detectedText = "(문자 인식 엔진이 아직 준비되지 않았습니다)";
      } else {
        try {
          const ocrResult = await worker.recognize(ocrSource);
          detectedText = ocrResult.data.text || "";
          console.log('[OCR 원본 결과]', JSON.stringify(detectedText));
        } catch (ocrErr) {
          console.error('[OCR 오류]', ocrErr);
          detectedText = "(문자 인식 중 오류 발생)";
        }
      }

      resultBox.style.display = 'block';

      const cleanQR = qrText.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
      const cleanOCR = detectedText.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();

      if (cleanOCR.includes(cleanQR) && cleanQR.length > 0) {
        resultBox.className = "result-box match";
        resultBox.innerHTML = `
          ✅ 일치합니다!
          <div class="details">
            <b>인식된 QR:</b> ${qrText}
          </div>
        `;
      } else {
        resultBox.className = "result-box mismatch";
        resultBox.innerHTML = `
          ❌ 불일치 또는 시리얼 미인식
          <div class="details">
            <b>인식된 QR:</b> ${qrText}<br>
            <b>인식된 글자:</b> ${detectedText.replace(/\n/g, ' ')}
          </div>
        `;
      }

      statusEl.innerText = `스캔 완료! ${RESCAN_DELAY_MS / 1000}초 뒤 다음 라벨을 자동으로 스캔합니다.`;
      setTimeout(() => {
        busy = false;
        resultBox.style.display = 'none';
        if (!paused) {
          statusEl.innerText = "실시간으로 QR코드를 찾는 중... 라벨을 카메라에 비춰주세요.";
        }
      }, RESCAN_DELAY_MS);
    }

    // 실행: OCR 엔진 로딩과 카메라 스캔을 동시에 시작 (서로 기다릴 필요 없음)
    window.addEventListener('DOMContentLoaded', () => {
      initOCR();
      startQrScanning();
    });
  </script>
</body>
</html>
